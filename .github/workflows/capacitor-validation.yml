name: Capacitor Validation

on:
  workflow_dispatch:
    inputs:
      capture_iphone_screenshots:
        description: Run screenshot-only iPhone simulator capture from Build 10 source
        required: false
        type: boolean
        default: false
  pull_request:

jobs:
  capacitor-validation:
    if: ${{ !inputs.capture_iphone_screenshots }}
    name: Validate Capacitor foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Restore Android Gradle wrapper jar
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar already present."
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          printf '' > "$tmpdir/settings.gradle"
          (cd "$tmpdir" && gradle wrapper --gradle-version 8.14.4 --distribution-type bin --no-validate-url)
          mkdir -p android/gradle/wrapper
          cp "$tmpdir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      - name: Build and verify deterministic native web bundle
        run: npm run build:native-web && npm run verify:native-web

      - name: Generate deterministic native raster assets
        run: npm run build:native-assets

      - name: Run Capacitor doctor
        run: |
          set +e
          doctor_output="$(npx cap doctor 2>&1)"
          doctor_status=$?
          set -e

          printf '%s\n' "$doctor_output"

          unexpected_errors="$(printf '%s\n' "$doctor_output" | sed -n '/\[error\]/p' | grep -v 'Xcode is not installed' || true)"

          if [ -n "$unexpected_errors" ]; then
            printf '%s\n' "Unexpected Capacitor doctor error(s):"
            printf '%s\n' "$unexpected_errors"
            exit 1
          fi

          if [ "$doctor_status" -ne 0 ]; then
            if printf '%s\n' "$doctor_output" | grep -q 'Xcode is not installed'; then
              printf '%s\n' "Ignoring expected Linux CI Xcode warning; iOS validation belongs in a macOS workflow."
              exit 0
            fi

            exit "$doctor_status"
          fi

      - name: Sync Android Capacitor project
        run: npx cap sync android

      - name: Test native packaging contracts
        run: npm run test:native-packaging

      - name: Check app JavaScript syntax
        run: node --check js/app.js

      - name: Check service worker syntax when present
        run: |
          if [ -f service-worker.js ]; then
            node --check service-worker.js
          else
            echo "service-worker.js not found; skipping syntax check."
          fi

      - name: Validate capacitor.config.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const configFiles = [
            'capacitor.config.json',
            'android/capacitor.config.json',
            'ios/App/App/capacitor.config.json',
          ];
          const invalidWebDirs = new Set(['', '.', '..', '../', './']);
          const configs = configFiles.map((file) => ({
            file,
            config: JSON.parse(fs.readFileSync(file, 'utf8')),
          }));

          for (const { file, config } of configs) {
            const requiredFields = ['appId', 'appName', 'webDir'];
            const missingFields = requiredFields.filter((field) => !config[field]);

            if (missingFields.length > 0) {
              throw new Error(`${file} is missing required field(s): ${missingFields.join(', ')}`);
            }

            if (invalidWebDirs.has(config.webDir)) {
              throw new Error(`${file} has invalid Capacitor webDir value: ${JSON.stringify(config.webDir)}`);
            }

            if (config.webDir !== 'www') {
              throw new Error(`${file} must use Gridly's dedicated Capacitor webDir: www`);
            }

            if (config.appId !== 'com.gridlygo.gridly' || config.appName !== 'Gridly') {
              throw new Error(`${file} does not use Gridly's permanent native identity.`);
            }

            if (!fs.existsSync(path.join(config.webDir, 'index.html'))) {
              throw new Error(`${config.webDir}/index.html must exist before Capacitor validation.`);
            }
          }

          const identity = ({ appId, appName, webDir, bundledWebRuntime }) =>
            JSON.stringify({ appId, appName, webDir, bundledWebRuntime });
          const rootConfig = identity(configs[0].config);
          for (const { file, config } of configs.slice(1)) {
            if (identity(config) !== rootConfig) {
              throw new Error(`${file} does not match capacitor.config.json`);
            }
          }

          console.log('Capacitor root config and Android/iOS snapshots are valid and aligned.');
          NODE

      - name: Validate manifest.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const requiredFields = ['name', 'short_name', 'display', 'start_url', 'icons'];
          const missingFields = requiredFields.filter((field) => !manifest[field]);

          if (missingFields.length > 0) {
            throw new Error(`manifest.json is missing required field(s): ${missingFields.join(', ')}`);
          }

          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            throw new Error('manifest.json must include at least one icon.');
          }

          console.log('manifest.json is valid JSON and includes required PWA manifest fields.');
          NODE

      - name: Note future iOS validation
        run: echo "iOS Capacitor sync is deferred to a future macOS workflow because iOS validation typically requires macOS, Xcode, and CocoaPods."

  iphone-screenshot-capture:
    if: ${{ inputs.capture_iphone_screenshots == true }}
    name: Capture Build 10 on iPhone simulator
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact Build 10 app source
        uses: actions/checkout@v4
        with:
          ref: a5c568e161f263388997820d762d50ee743efabd
          persist-credentials: false

      - name: Verify source and simulator availability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a5c568e161f263388997820d762d50ee743efabd
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list devicetypes | grep -E 'iPhone (14 Plus|11 Pro Max)'
          xcrun simctl list runtimes available

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Stage unchanged Build 10 runtime and build simulator app
        shell: bash
        env:
          GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64: ${{ secrets.GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64"
          npm ci
          printf '%s' "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64" | base64 -D > "$RUNNER_TEMP/native-provider-config.json"
          npm run build:native-assets
          node tools/native-web.mjs --runtime-config-file "$RUNNER_TEMP/native-provider-config.json" --report-file .artifacts/native-web-identity.json
          node tools/native-web.mjs --verify --report-file .artifacts/native-web-identity.json
          rm -f "$RUNNER_TEMP/native-provider-config.json"
          npx cap sync ios
          if test -f ios/App/Podfile; then (cd ios/App && pod install); fi
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/gridly-derived" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=10 build

      - name: Boot matching iPhone simulator and capture initial UI
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus
          xcrun simctl list devicetypes | grep -F "$DEVICE_TYPE"
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"] == "iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')
          DEVICE=$(xcrun simctl create Gridly-App-Store-65 "$DEVICE_TYPE" "$RUNTIME")
          echo "Simulator device=$DEVICE runtime=$RUNTIME"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$RUNNER_TEMP/gridly-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.gridlygo.gridly
          sleep 20
          mkdir -p "$RUNNER_TEMP/gridly-screenshots"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/gridly-screenshots/initial.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/gridly-screenshots/initial.png"
          java -version
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          cat > "$RUNNER_TEMP/gridly-skip-onboarding.yaml" <<'FLOW'
          appId: com.gridlygo.gridly
          ---
          - tapOn: Skip
          FLOW
          maestro --device "$DEVICE" test "$RUNNER_TEMP/gridly-skip-onboarding.yaml"
          sleep 45
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/gridly-screenshots/after-skip.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/gridly-screenshots/after-skip.png"

      - name: Preserve simulator screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridly-build10-iphone-simulator-initial
          path: ${{ runner.temp }}/gridly-screenshots/*.png
          if-no-files-found: warn
          retention-days: 3
