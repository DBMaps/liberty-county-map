name: Gridly Build 18 Xcode lockfile retrieval

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: gridly-build18-resolver-replay
  cancel-in-progress: false

jobs:
  resolver:
    if: github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/gridly-build18-resolver-replay' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c191cef94e3468dfcdca5e4566ae82604f3605a6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify the single public Xcode lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import subprocess

          source = "c191cef94e3468dfcdca5e4566ae82604f3605a6"
          lock = "ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          allowed = {
              "COMBINED_RELEASE_SOURCE_VERIFIED",
              "COMBINED_PROFILE_REJECTED",
              "COMBINED_BASELINE_REJECTED",
              "COMBINED_APPROVED_SOURCE_MISMATCH",
              "COMBINED_RELEASE_SOURCE_REJECTED",
              "COMBINED_UNRELATED_SOURCE_CHANGE",
              "COMBINED_SOURCE_HASH_MISMATCH",
              "COMBINED_OPERATION_REJECTED",
          }

          def status():
              entries = subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "-z", "--no-renames", "--untracked-files=all"]
              ).split(b"\0")
              tracked, untracked = [], []
              for entry in filter(None, entries):
                  kind, path = entry[:2].decode("ascii"), os.fsdecode(entry[3:])
                  if kind == "??":
                      untracked.append(path)
                  else:
                      tracked.append({"status": kind, "path": path})
              return tracked, untracked

          def verify():
              result = subprocess.run(
                  ["node", "tools/arcgis-maintenance/combined-release.mjs", "ios",
                   "--check-release-source", source], capture_output=True
              )
              lines = (result.stdout + result.stderr).decode("ascii", errors="replace").splitlines()
              codes = [line for line in lines if line in allowed]
              return {"exit": result.returncode, "code": codes[0] if len(codes) == 1 else "UNCLASSIFIED"}

          before = verify()
          if (subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() != source
                  or status() != ([], []) or os.path.lexists(lock)
                  or before != {"exit": 0, "code": "COMBINED_RELEASE_SOURCE_VERIFIED"}):
              print(json.dumps({"source_before": before, "result": "BASELINE_REJECTED"}), flush=True)
              raise SystemExit(1)

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          resolved = subprocess.run(
              ["xcodebuild", "-resolvePackageDependencies", "-project", "ios/App/App.xcodeproj",
               "-scheme", "App", "-derivedDataPath", str(temp / "derived-data"),
               "-clonedSourcePackagesDirPath", str(temp / "source-packages")],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
          )
          tracked, untracked = status()
          after = verify()
          path = pathlib.Path(lock)
          lock_present = path.is_file() and path.resolve() == path.absolute()
          lock_alone = (resolved.returncode == 0 and not tracked and untracked == [lock] and lock_present
                        and after == {"exit": 1, "code": "COMBINED_RELEASE_SOURCE_REJECTED"})
          print(json.dumps({
              "source_before": before, "resolver_exit": resolved.returncode,
              "tracked": tracked, "untracked": untracked,
              "expected_lock_present": lock_present, "source_after": after,
              "lockfile_reproduced": lock_alone,
          }), flush=True)
          if not lock_alone:
              raise SystemExit("LOCKFILE_RESOLUTION_REJECTED")

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate field")
                  result[key] = value
              return result

          package = {
              "identity": "capacitor-swift-pm",
              "kind": "remoteSourceControl",
              "location": "https://github.com/ionic-team/capacitor-swift-pm.git",
              "state": {"version": "8.3.4", "revision": "992959f0467c781eb6a1637e69d87481238c3672"},
          }
          try:
              with path.open("rb") as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or not 0 < info.st_size <= 4096:
                      raise ValueError("invalid file")
                  body = stream.read(4097)
              if len(body) != info.st_size:
                  raise ValueError("invalid size")
              document = json.loads(body.decode("utf-8"), object_pairs_hook=unique_keys)
              version = document["version"]
              if type(version) is not int or version not in (2, 3) or document["pins"] != [package]:
                  raise ValueError("invalid pins")
              expected_fields = {"version", "pins"}
              if version == 3 and "originHash" in document:
                  expected_fields.add("originHash")
                  if not re.fullmatch(r"[0-9a-f]{64}", document["originHash"]):
                      raise ValueError("invalid origin hash")
              if set(document) != expected_fields:
                  raise ValueError("unexpected fields")
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit("LOCKFILE_METADATA_REJECTED") from None

          artifact_root = temp / "gridly-verified-lockfile"
          artifact_root.mkdir(mode=0o700, exist_ok=False)
          retained = artifact_root / lock
          retained.parent.mkdir(parents=True)
          with retained.open("xb") as stream:
              stream.write(body)
          print(json.dumps({
              "lockfile": lock, "sha256": hashlib.sha256(body).hexdigest(), "bytes": len(body),
              "package": package["identity"], "version": package["state"]["version"],
              "revision": package["state"]["revision"],
          }), flush=True)
          PY
      - name: Retain only the verified public lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridly-build18-verified-package-resolved
          path: ${{ runner.temp }}/gridly-verified-lockfile/
          if-no-files-found: error
          retention-days: 1
