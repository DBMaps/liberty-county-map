          ad27670b2fc575656aedd8bf185853def907bf21b2401e82cb1c94f9175e1739  prototypes/ios-arcgis-labels/LabelTileHarness.xcodeproj/project.pbxproj
          88c4f8ff3cde89deb25a71c7e2a5424e563dd611d89936ffe44c6e93beb5e3ad  prototypes/ios-arcgis-labels/LabelTileHarness.xcodeproj/xcshareddata/xcschemes/LabelTileHarness.xcscheme
          27d552b983b8102261ff9fe3756854c81df586a39355f9246d73d9eb848c00f5  prototypes/ios-arcgis-labels/Package.swift
          50a2414fe58bab08fa1e4448f6c3b60435aa8ae6ac020a104a1c4e401891c63f  prototypes/ios-arcgis-labels/README.md
          f3f09d3eef861288ed4cb36568a595a1ac4653fe566db29b6073aeda71d3e79c  prototypes/ios-arcgis-labels/Sources/TileCore/LabelTileCore.swift
          074065f07e35265d9695cced0f42844dbb02e5766c4ed185d0a372b2d033b093  prototypes/ios-arcgis-labels/Tests/TileCoreTests/Fixtures/valid.png
          edd19b086426b6cb1c33b6e0e9bc3f7f9f8f70f2c1af499a8cb78e7a84d13321  prototypes/ios-arcgis-labels/Tests/TileCoreTests/LabelTileSchemeHandlerTests.swift
          bd034108f6429d54f4a3b8209c125e309f2858fc0e6b0ce166e85f78da082921  prototypes/ios-arcgis-labels/Tests/map.test.mjs
          746ec7b5a9e3faeba9fa874096e214f25b33671f0d77ca2831969b8a470d4f90  prototypes/ios-arcgis-labels/Web/imagery.svg
          261cc07a00f072a54642ab25100e65f48b9d5a1e83c6cc49a75f4c44374a99d9  prototypes/ios-arcgis-labels/Web/map.html
          bc8bfa03ac0341a604069852d8c0305b0f6a6323f5c691325ec85d7aea19bdec  prototypes/ios-arcgis-labels/Web/map.js
          53e8dc25862014e4324741ca18fbe3611e11d42ef69f59f86ea8c5389647d4cb  prototypes/ios-arcgis-labels/Web/vendor/LICENSE
          a7837102824184820dfa198d1ebcd109ff6d0ff9a2672a074b9a1b4d147d04c6  prototypes/ios-arcgis-labels/Web/vendor/leaflet.css
          db49d009c841f5ca34a888c96511ae936fd9f5533e90d8b2c4d57596f4e5641a  prototypes/ios-arcgis-labels/Web/vendor/leaflet.js
          FILES
          diff -u <(cut -c67- "$RUNNER_TEMP/mock-sources.sha256") <(git ls-files -- prototypes/ios-arcgis-labels prototypes/ios-arcgis-labels-gateway "$HARNESS")
          test -z "$(find prototypes/ios-arcgis-labels prototypes/ios-arcgis-labels-gateway "$HARNESS" -type l -print)"
          shasum -a 256 -c "$RUNNER_TEMP/mock-sources.sha256"
          node "$HARNESS/verify-source.mjs"
          sw_vers
          xcodebuild -version
          swift --version
          node --version

      - name: Run all 62 Node tests
        run: |
          set -euo pipefail
          run_suite() {
            node --test --test-reporter=tap "$1" | tee "$RUNNER_TEMP/mock-node.log"
            grep -Fx "# tests $2" "$RUNNER_TEMP/mock-node.log"
            grep -Fx "# pass $2" "$RUNNER_TEMP/mock-node.log"
            grep -Fx '# skipped 0' "$RUNNER_TEMP/mock-node.log"
          }
          run_suite prototypes/ios-arcgis-labels-gateway/gateway.test.mjs 37
          run_suite prototypes/ios-arcgis-labels/Tests/map.test.mjs 7
          run_suite "$HARNESS/integration.test.mjs" 18

      - name: Run all 17 Swift tests and signing parity checks
        run: |
          set -euo pipefail
          swift test --package-path "$HARNESS" --scratch-path "$RUNNER_TEMP/mock-swift" 2>&1 | tee "$RUNNER_TEMP/mock-swift.log"
          grep -Eq 'Executed 17 tests, with 0 failures' "$RUNNER_TEMP/mock-swift.log"
          for test_case in \
            testNodeWireVectorMatchesCanonicalBytesAndVerifiesInCryptoKit \
            testSyntheticAdmissionToSignedFixtureAndReplay \
            testWrongEnvironmentAndUnverifiedDecisionNeverIssue \
            testWrongKeyAlteredPathSkewAndExpiredLeaseFailClosed \
            testQuotaCancellationAndRevocationWhileTileIsInFlight \
            testInvalidPNGCountsProviderAttempt; do
            grep -F "$test_case]' passed" "$RUNNER_TEMP/mock-swift.log"
          done

      - name: Build and inspect the unsigned mock simulator app
        run: |
          set -euo pipefail
          xcodebuild build -project "$HARNESS/LabelTileHarness.xcodeproj" \
            -scheme LabelTileHarness -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/integration-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          app="$RUNNER_TEMP/integration-derived/Build/Products/Debug-iphonesimulator/LabelTileHarness.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$APP_ID"
          test ! -e "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          test -z "$(find "$app" -type l -print)"
          diff -r "$HARNESS/Web" "$app/Web"
          cmp "$HARNESS/Tests/TileCoreTests/Fixtures/valid.png" "$app/valid.png"
          (cd "$app" && find . -type f -print) | while IFS= read -r file; do
            case "$file" in
              ./Info.plist|./PkgInfo|./LabelTileHarness|./LabelTileHarness.debug.dylib|./__preview.dylib|./valid.png|./Web/*) ;;
              *) echo 'UNEXPECTED_APP_RESOURCE'; exit 1 ;;
            esac
          done

      - name: Try the harness on an installed iPhone simulator
        id: simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          id="$(xcrun simctl list devices booted --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for runtime, group in devices.items() if ".iOS-" in runtime
                      for d in group if d["name"].startswith("iPhone")), ""))
          ')"
          if [[ -z "$id" ]]; then
            id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for runtime, group in devices.items() if ".iOS-" in runtime
                      for d in group if d["name"].startswith("iPhone") and d["state"] == "Shutdown"), ""))
          ')"
            if [[ -z "$id" ]]; then
              echo 'SIMULATOR_UNAVAILABLE'
              exit 1
            fi
            trap 'xcrun simctl shutdown "$id" >/dev/null 2>&1 || true' EXIT
            xcrun simctl boot "$id"
          fi
          xcrun simctl bootstatus "$id" -b
          app="$RUNNER_TEMP/integration-derived/Build/Products/Debug-iphonesimulator/LabelTileHarness.app"
          xcrun simctl install "$id" "$app"
          launched="$(xcrun simctl launch "$id" "$APP_ID")"
          [[ "$launched" =~ ^com\.gridlygo\.prototype\.labeltiles\.integration:\ ([0-9]+)$ ]]
          pid="${BASH_REMATCH[1]}"
          echo 'SIMULATOR_INSTALLED_AND_LAUNCHED'
          predicate="process == \"LabelTileHarness\" AND subsystem == \"$APP_ID\" AND category == \"mock-gateway\" AND eventMessage == \"MOCK_GATEWAY_PNG_DELIVERED\""
          for attempt in {1..6}; do
            sleep 5
            kill -0 "$pid"
            xcrun simctl spawn "$id" log show --last 2m --style compact --predicate "$predicate" > "$RUNNER_TEMP/integration-delivery.log"
            if grep -Eq 'MOCK_GATEWAY_PNG_DELIVERED$' "$RUNNER_TEMP/integration-delivery.log"; then break; fi
          done
          sleep 3
          kill -0 "$pid"
          echo 'SIMULATOR_PROCESS_RUNNING'
          xcrun simctl io "$id" screenshot "$RUNNER_TEMP/integration-simulator.png"
          echo 'screenshot=true' >> "$GITHUB_OUTPUT"
          xcrun simctl spawn "$id" log show --last 2m --style compact \
            --predicate "process == \"LabelTileHarness\" AND (messageType == error OR messageType == fault)" > "$RUNNER_TEMP/integration-diagnostics.log"
          for category in 'WebContent process' 'GPU process' 'WebPrivacy' 'Unable to filter' 'Failed to resolve host network app id'; do
            printf '%s occurrences: %s\n' "$category" "$(grep -Fc "$category" "$RUNNER_TEMP/integration-diagnostics.log" || true)"
          done
          grep -Eq 'MOCK_GATEWAY_PNG_DELIVERED$' "$RUNNER_TEMP/integration-delivery.log"
          echo 'NATIVE_MOCK_GATEWAY_PNG_DELIVERY_CONFIRMED'

      - name: Retain the mock simulator screenshot
        if: always() && steps.simulator.outputs.screenshot == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gridly-label-integration-simulator
          path: ${{ runner.temp }}/integration-simulator.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify checkout was left clean
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
