          8ac60bcf965bde4c754aaf700255fd7a878828c81183d75469d0c4229ebc69f6  prototypes/ios-arcgis-labels-gateway/gateway.test.mjs
          074065f07e35265d9695cced0f42844dbb02e5766c4ed185d0a372b2d033b093  prototypes/ios-arcgis-labels-gateway/mock-tile.png
          507e0f8913dda30439b583c9c8e18f40d961096a56cb90aa95864cd8988aad11  prototypes/ios-arcgis-labels-gateway/png.mjs
