          074065f07e35265d9695cced0f42844dbb02e5766c4ed185d0a372b2d033b093  prototypes/ios-arcgis-labels-integration/Tests/TileCoreTests/Fixtures/valid.png
          852144bff24fa645e376dc3c02d480e20d298cb232cb6081ea616ac87b8635bb  prototypes/ios-arcgis-labels-integration/Tests/TileCoreTests/Fixtures/wire-proof.json
