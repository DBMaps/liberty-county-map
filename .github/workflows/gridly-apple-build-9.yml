          749dc742cb655cb6d73e3b714f7b4737dc6c3f9852eda59f0fed84fa7cf47de5  prototypes/ios-arcgis-labels-integration/Tests/TileCoreTests/MockGatewayTests.swift
          746ec7b5a9e3faeba9fa874096e214f25b33671f0d77ca2831969b8a470d4f90  prototypes/ios-arcgis-labels-integration/Web/imagery.svg
