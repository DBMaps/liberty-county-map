name: Gridly iOS Label Integration Certification

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact reviewed mock integration certification commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gridly-ios-label-integration-certification
  cancel-in-progress: false

jobs:
  certify:
    if: github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/gridly-ios-label-integration-certification' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
      HARNESS: prototypes/ios-arcgis-labels-integration
      APP_ID: com.gridlygo.prototype.labeltiles.integration
    steps:
      - name: Verify the requested commit before checkout
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Checkout the exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /prototypes/ios-arcgis-labels/
            /prototypes/ios-arcgis-labels-gateway/
            /prototypes/ios-arcgis-labels-integration/
            /.github/workflows/gridly-apple-build-9.yml

      - name: Verify prototype inventory, hashes, and isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          cat > "$RUNNER_TEMP/mock-sources.sha256" <<'FILES'
          311d06cf45d216ddc7d13d58e66753adfbf9902b0e7a3632c674639bc58d67f7  prototypes/ios-arcgis-labels-gateway/README.md
          c4dab7a11e2ce4f29369afac168b3408f2bd8c8d89fd70673283b576a31dbab1  prototypes/ios-arcgis-labels-gateway/contract.md
          4230e7b5050663ad8ac8fdfeeb51d0113529eae877922fec22fe5fed213af318  prototypes/ios-arcgis-labels-gateway/gateway.bench.mjs
