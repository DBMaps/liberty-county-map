name: Gridly Apple Build 9

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact certified launch commit to package
        required: true
        type: string
      upload_to_app_store_connect:
        description: Validate and upload the signed Build 9 IPA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apple-build-9:
    if: ${{ inputs.upload_to_app_store_connect == true && github.ref == 'refs/heads/codex/reporting-launch-closure' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact certified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify source and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
          xcodebuild -version | grep -E '^Xcode 26([. ]|$)'
          grep -q 'GRIDLY_ANDROID_LICENSE_TEST_CANDIDATE = false' js/gridly-paid-ui.mjs
          grep -q 'gridly-paid-report' js/app.js
          grep -q 'versionCode 8' android/app/build.gradle
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and test paid reporting
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tests/paid-report-authorization.test.mjs tests/lp24465-paid-access.test.mjs
      - name: Stage production web runtime and sync iOS
        shell: bash
        env:
          GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64: ${{ secrets.GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64"
          printf '%s' "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64" | base64 -D > "$RUNNER_TEMP/native-provider-config.json"
          npm run build:native-assets
          node tools/native-web.mjs --runtime-config-file "$RUNNER_TEMP/native-provider-config.json" --report-file .artifacts/native-web-identity.json
          node tools/native-web.mjs --verify --report-file .artifacts/native-web-identity.json
          rm -f "$RUNNER_TEMP/native-provider-config.json"
          npx cap sync ios
          if test -f ios/App/Podfile; then (cd ios/App && pod install); fi
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Install distribution signing
        shell: bash
        env:
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DIST_P12_BASE64" && test -n "$APPLE_DIST_P12_PASSWORD" && test -n "$APPLE_PROVISION_PROFILE_BASE64"
          printf '%s' "$APPLE_DIST_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.mobileprovision"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" gridly-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" gridly-build.keychain
          security import "$RUNNER_TEMP/distribution.p12" -k gridly-build.keychain -P "$APPLE_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" gridly-build.keychain >/dev/null
          security list-keychains -d user -s gridly-build.keychain
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$APP_ID" = "$TEAM_ID.com.gridlygo.gridly"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          { printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME"; printf 'TEAM_ID=%s\n' "$TEAM_ID"; } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
      - name: Archive and export Build 9
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>com.gridlygo.gridly</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gridly-Build-9.xcarchive" CURRENT_PROJECT_VERSION=9 \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Gridly-Build-9.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/gridly-export"
          IPA=$(find "$RUNNER_TEMP/gridly-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" && test -f "$IPA"
          printf 'IPA_PATH=%s\n' "$IPA" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Gridly-Build-9.xcarchive/Products/Applications/App.app/Info.plist" | grep -x 9
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Gridly-Build-9.xcarchive/Products/Applications/App.app/Info.plist" | grep -x 1.0.0
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Gridly-Build-9.xcarchive/Products/Applications/App.app/Info.plist" | grep -x com.gridlygo.gridly
      - name: Validate and upload IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY_P8_BASE64"; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s' "$ASC_PRIVATE_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
            chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            test -n "$APPLE_ID_USERNAME" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --username "$APPLE_ID_USERNAME" --password "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --username "$APPLE_ID_USERNAME" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi
      - name: Preserve signed artifact for owner review
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: gridly-apple-build-9
          path: |
            ${{ runner.temp }}/gridly-export/*.ipa
            ${{ runner.temp }}/Gridly-Build-9.xcarchive
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/native-provider-config.json" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          security delete-keychain gridly-build.keychain 2>/dev/null || true
