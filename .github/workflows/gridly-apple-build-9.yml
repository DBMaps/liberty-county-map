name: Gridly iOS Label Prototype Certification

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact reviewed prototype certification commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gridly-ios-label-prototype-certification
  cancel-in-progress: false

jobs:
  certify:
    if: github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/gridly-ios-label-prototype-certification' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
      PROTOTYPE: prototypes/ios-arcgis-labels
    steps:
      - name: Verify the requested commit before checkout
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Checkout the exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /prototypes/ios-arcgis-labels/
            /.github/workflows/gridly-apple-build-9.yml

      - name: Record toolchain, verify inventory, and hash prototype files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          diff -u <(cat <<'FILES'
          prototypes/ios-arcgis-labels/.gitignore
          prototypes/ios-arcgis-labels/App/GridlyLabelTileSchemeHandler.swift
          prototypes/ios-arcgis-labels/App/LabelTileHarness.swift
          prototypes/ios-arcgis-labels/LabelTileHarness.xcodeproj/project.pbxproj
          prototypes/ios-arcgis-labels/LabelTileHarness.xcodeproj/xcshareddata/xcschemes/LabelTileHarness.xcscheme
          prototypes/ios-arcgis-labels/Package.swift
          prototypes/ios-arcgis-labels/README.md
          prototypes/ios-arcgis-labels/Sources/TileCore/LabelTileCore.swift
          prototypes/ios-arcgis-labels/Tests/TileCoreTests/Fixtures/valid.png
          prototypes/ios-arcgis-labels/Tests/TileCoreTests/LabelTileSchemeHandlerTests.swift
          prototypes/ios-arcgis-labels/Tests/map.test.mjs
          prototypes/ios-arcgis-labels/Web/imagery.svg
          prototypes/ios-arcgis-labels/Web/map.html
          prototypes/ios-arcgis-labels/Web/map.js
          prototypes/ios-arcgis-labels/Web/vendor/LICENSE
          prototypes/ios-arcgis-labels/Web/vendor/leaflet.css
          prototypes/ios-arcgis-labels/Web/vendor/leaflet.js
          FILES
          ) <(git ls-files -- "$PROTOTYPE")
          git ls-files -- "$PROTOTYPE" | while IFS= read -r file; do
            test -f "$file" && test ! -L "$file" || exit 1
            shasum -a 256 "$file"
          done
          sw_vers
          xcodebuild -version
          swift --version
          node --version

      - name: Run seven Node tests and verify local mock resources
        run: |
          set -euo pipefail
          cd "$PROTOTYPE"
          test -f Web/imagery.svg && test -f Web/vendor/leaflet.js && test -f Web/vendor/leaflet.css
          if git grep -iE 'arcgis[.]com|GRIDLY_RUNTIME_CONFIG|native-provider-config|secrets[.]' -- App Sources Web/map.html Web/map.js; then
            echo 'External service or production configuration reference found'
            exit 1
          fi
          node --test --test-reporter=tap Tests/map.test.mjs | tee "$RUNNER_TEMP/label-node-tests.log"
          grep -Fx '# tests 7' "$RUNNER_TEMP/label-node-tests.log"
          grep -Fx '# pass 7' "$RUNNER_TEMP/label-node-tests.log"

      - name: Run eleven Swift tests
        run: |
          set -euo pipefail
          swift test --package-path "$PROTOTYPE" --scratch-path "$RUNNER_TEMP/label-swift" 2>&1 | tee "$RUNNER_TEMP/label-swift-tests.log"
          grep -Eq 'Executed 11 tests, with 0 failures' "$RUNNER_TEMP/label-swift-tests.log"

      - name: Build the unsigned iOS Simulator harness
        run: |
          set -euo pipefail
          xcodebuild build -project "$PROTOTYPE/LabelTileHarness.xcodeproj" \
            -scheme LabelTileHarness -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/label-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= 2>&1 | tee "$RUNNER_TEMP/label-build.log"
          if grep -F 'range of supported deployment target versions' "$RUNNER_TEMP/label-build.log"; then
            echo 'Selected SDK does not support the prototype deployment target'
            exit 1
          fi
          app="$RUNNER_TEMP/label-derived/Build/Products/Debug-iphonesimulator/LabelTileHarness.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = com.gridlygo.prototype.labeltiles
          test ! -e "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          diff -r "$PROTOTYPE/Web" "$app/Web"

      - name: Try the harness on an installed iPhone simulator
        id: simulator
        timeout-minutes: 7
        run: |
          set -euo pipefail
          id="$(xcrun simctl list devices booted --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for runtime, group in devices.items() if ".iOS-" in runtime
                      for d in group if d["name"].startswith("iPhone")), ""))
          ')"
          if [[ -z "$id" ]]; then
            id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for runtime, group in devices.items() if ".iOS-" in runtime
                      for d in group if d["name"].startswith("iPhone") and d["state"] == "Shutdown"), ""))
          ')"
            if [[ -z "$id" ]]; then
              echo 'SIMULATOR_UNAVAILABLE'
              exit 0
            fi
            trap 'xcrun simctl shutdown "$id" >/dev/null 2>&1 || true' EXIT
            xcrun simctl boot "$id"
          fi
          xcrun simctl bootstatus "$id" -b
          app="$RUNNER_TEMP/label-derived/Build/Products/Debug-iphonesimulator/LabelTileHarness.app"
          xcrun simctl install "$id" "$app"
          launched="$(xcrun simctl launch "$id" com.gridlygo.prototype.labeltiles)"
          [[ "$launched" =~ ^com\.gridlygo\.prototype\.labeltiles:\ ([0-9]+)$ ]]
          pid="${BASH_REMATCH[1]}"
          sleep 10
          kill -0 "$pid"
          echo 'SIMULATOR_PROCESS_RUNNING'
          xcrun simctl spawn "$id" log show --last 45s --style compact \
            --predicate 'process == "LabelTileHarness" AND (messageType == error OR messageType == fault)'
          xcrun simctl io "$id" screenshot "$RUNNER_TEMP/label-simulator.png"
          echo 'screenshot=true' >> "$GITHUB_OUTPUT"

      - name: Retain the mock simulator screenshot
        if: steps.simulator.outputs.screenshot == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gridly-label-prototype-simulator
          path: ${{ runner.temp }}/label-simulator.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify checkout was left clean
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
