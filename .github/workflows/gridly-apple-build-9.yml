          88c4f8ff3cde89deb25a71c7e2a5424e563dd611d89936ffe44c6e93beb5e3ad  prototypes/ios-arcgis-labels-integration/LabelTileHarness.xcodeproj/xcshareddata/xcschemes/LabelTileHarness.xcscheme
