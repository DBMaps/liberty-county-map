name: Gridly Build 18 tracked lockfile verification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify-lockfile:
    if: github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/gridly-build18-lockfile-verification' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8cb40f70fc29bcfb441245751b667790b0e9e6b2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact tracked lockfile before and after Xcode resolution
        shell: bash
        run: |
          set -euo pipefail
          lock='ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          check() {
            test "$(git rev-parse HEAD)" = '8cb40f70fc29bcfb441245751b667790b0e9e6b2'
            git ls-files --error-unmatch -- "$lock" >/dev/null
            test "$(shasum -a 256 "$lock")" = "6922debd29edb339290d4910bf91dd151731506f4bfe6f553d2899314608a94d  $lock"
            test "$(wc -c < "$lock" | tr -d '[:space:]')" = 408
            node tools/arcgis-maintenance/combined-release.mjs ios --check-release-source '8cb40f70fc29bcfb441245751b667790b0e9e6b2'
          }
          check
          if ! xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath "$RUNNER_TEMP/derived-data" -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" >/dev/null 2>&1; then
            echo 'XCODE_RESOLUTION_FAILED'
            exit 1
          fi
          echo 'XCODE_RESOLUTION_PASSED'
          check
          echo 'TRACKED_PACKAGE_LOCK_VERIFIED_AFTER_RESOLUTION'
