name: Gridly Apple 1.0.1 Build 16 certification only

# Isolated control adaptation at the existing registered manual workflow path.
# Application source stays exactly pinned below; controls are a separate reviewed
# direct-child commit changing ONLY this workflow. Publish/dispatch needs approval.
# Manual tag dispatch only. No store credentials, transfer or artifact upload.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact certified application SHA (must match the fixed application pin)
        required: true
        type: string
      upload_to_app_store_connect:
        description: Must remain false; true is rejected before any secret access
        required: true
        default: false
        type: boolean
      control_commit:
        description: Exact reviewed control commit named in the immutable control tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gridly-apple-acceptance-build-only
  cancel-in-progress: false

jobs:
  archive-only:
    if: github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' && github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect == false && startsWith(github.ref, 'refs/tags/gridly-apple-acceptance-control-16-')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLICATION_SHA: '0e9eebd185dac45aa3382471870092852645941b'
      BUILD_NUMBER: '16'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0e9eebd185dac45aa3382471870092852645941b
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent control and application provenance before secrets
        env:
          REVIEWED_CONTROL_COMMIT: ${{ inputs.control_commit }}
          REQUESTED_APPLICATION_SHA: ${{ inputs.commit_sha }}
          UPLOAD_REQUESTED: ${{ inputs.upload_to_app_store_connect }}
        run: |
          set +x
          test "$GITHUB_REPOSITORY" = DBMaps/liberty-county-map
          test "$GITHUB_ACTOR" = DBMaps
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$UPLOAD_REQUESTED" = false
          [[ "$REVIEWED_CONTROL_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_APPLICATION_SHA" = "$APPLICATION_SHA"
          test "$REVIEWED_CONTROL_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$REVIEWED_CONTROL_COMMIT"
          test "$GITHUB_REF" = "refs/tags/gridly-apple-acceptance-control-16-$REVIEWED_CONTROL_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = "DBMaps/liberty-county-map/.github/workflows/gridly-apple-build-9.yml@$GITHUB_REF"
          test "$(git -C control rev-parse HEAD)" = "$REVIEWED_CONTROL_COMMIT"
          test "$(git -C control cat-file -t "$GITHUB_REF")" = tag
          test "$(git -C control rev-parse "$GITHUB_REF^{commit}")" = "$REVIEWED_CONTROL_COMMIT"
          test "$(git -C control show -s --format=%P HEAD)" = "$APPLICATION_SHA"
          test "$(git -C control diff --name-only --no-renames "$APPLICATION_SHA" HEAD)" = .github/workflows/gridly-apple-build-9.yml
          control_state="$(git -C control status --porcelain --untracked-files=normal)"
          test -z "$control_state"
          test "$(git -C candidate rev-parse HEAD)" = "$APPLICATION_SHA"
          candidate_state="$(git -C candidate status --porcelain --untracked-files=normal)"
          test -z "$candidate_state"
          python3 -B candidate/tools/apple_acceptance_build_only.py preflight --source candidate --source-commit "$APPLICATION_SHA" --build-number "$BUILD_NUMBER" --marketing-version 1.0.1
          test "$(uname -s)" = Darwin
          xcodebuild -version | grep -E '^Xcode 26([. ]|$)'
          swift --version >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and run bounded native contracts
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          node --test tests/community-loading-performance-repair.test.cjs tests/community-loading-nws-safety.test.cjs tests/community-loading-production-integration.test.cjs tests/native-packaging.test.mjs tests/build13-native-pending-recovery.test.cjs tests/paid-report-authorization.test.mjs tests/lp24463-apple-storekit.test.mjs tests/native-version-compatibility.test.mjs tests/google-review-access.test.mjs
          node tools/android-acceptance/fast.mjs
          python3 -B tests/apple_native_parity_test.py
          python3 -B tests/apple_acceptance_build_only_test.py
      - name: Require all 14 compiled Swift compatibility and lifecycle cases
        working-directory: candidate
        run: |
          python3 -B tests/build14-native-lifecycle.test.py | tee "$RUNNER_TEMP/gridly-swift-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          grep -Fxq 'Production Swift lifecycle gate: 14 cases PASS' "$RUNNER_TEMP/gridly-swift-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          rm -f "$RUNNER_TEMP/gridly-swift-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
      - name: Stage, sign, archive, export locally and attest (no transfer)
        env:
          GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64: ${{ secrets.GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64 }}
          APPLE_DIST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.APPLE_DIST_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_DIST_CERT_PEM_BASE64: ${{ secrets.APPLE_DIST_CERT_PEM_BASE64 }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set +x
          umask 077
          test "$BUILD_NUMBER" = 16
          private="$RUNNER_TEMP/gridly-build-only-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$private"
          # Secret-bearing tool logs remain runner-private; only allowlisted
          # non-secret attestation fields are emitted after success.
          exec 3>&1
          exec > "$private/build.log" 2>&1
          cd candidate
          test -n "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64"
          printf '%s' "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64" | base64 -D > "$private/native-config.json"
          node tools/native-assets.mjs
          node tools/native-web.mjs --runtime-config-file "$private/native-config.json" --report-file "$private/web-identity.json"
          node tools/native-web.mjs --verify --report-file "$private/web-identity.json"
          npx --no-install cap sync ios
          if test -f ios/App/Podfile; then (cd ios/App && pod install); fi
          xcodebuild -version | grep -E '^Xcode 26([. ]|$)'
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath "$private/derived-data" -clonedSourcePackagesDirPath "$private/source-packages"
          test -n "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64"
          test -n "$APPLE_DIST_CERT_PEM_BASE64"
          test -n "$APPLE_PROVISION_PROFILE_BASE64"
          printf '%s' "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64" | base64 -D > "$private/key.pem"
          printf '%s' "$APPLE_DIST_CERT_PEM_BASE64" | base64 -D > "$private/cert.pem"
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 -D > "$private/profile.mobileprovision"
          key_sha=$(openssl pkey -in "$private/key.pem" -pubout -outform DER | shasum -a 256 | awk '{print $1}')
          cert_sha=$(openssl x509 -in "$private/cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')
          test "$key_sha" = "$cert_sha"
          export P12_PASSWORD="$(openssl rand -hex 32)"
          openssl pkcs12 -export -legacy -inkey "$private/key.pem" -in "$private/cert.pem" -out "$private/cert.p12" -passout env:P12_PASSWORD
          openssl pkcs12 -legacy -in "$private/cert.p12" -passin env:P12_PASSWORD -info -noout >/dev/null 2>&1
          keychain="$private/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security list-keychains -d user > "$private/previous-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$private/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F '1264FCB7434D20490824D05F959D90D3825EA45C "Apple Distribution: DJ Burns Collective LLC (2XSH6R7K37)"'
          security cms -D -k "$keychain" -i "$private/profile.mobileprovision" > "$private/profile.plist"
          # Existing certified profile and signing authority, never auto-renewed.
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$private/profile.plist")" = 'Gridly App Store Build 9'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$private/profile.plist")" = c0398bd6-9b5e-4935-82e7-40d117a4ccdc
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$private/profile.plist")" = 2XSH6R7K37
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$private/profile.plist")" = 2XSH6R7K37.com.gridlygo.gridly
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$profile_dir/c0398bd6-9b5e-4935-82e7-40d117a4ccdc.mobileprovision"
          mkdir -p "$profile_dir"
          if test -f "$profile"; then cp "$profile" "$private/previous-profile.mobileprovision"; fi
          cp "$private/profile.mobileprovision" "$profile"
          cat > "$private/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>uploadSymbols</key><false/>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>2XSH6R7K37</string>
          <key>provisioningProfiles</key><dict><key>com.gridlygo.gridly</key><string>Gridly App Store Build 9</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$private/derived-data" -clonedSourcePackagesDirPath "$private/source-packages" -archivePath "$private/Gridly.xcarchive" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION=1.0.1 DEVELOPMENT_TEAM=2XSH6R7K37 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="Gridly App Store Build 9" archive
          xcodebuild -exportArchive -archivePath "$private/Gridly.xcarchive" -exportOptionsPlist "$private/export.plist" -exportPath "$private/export"
          ipa=$(find "$private/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          python3 -B tools/apple_acceptance_build_only.py attest --source . --source-commit "$APPLICATION_SHA" --build-number "$BUILD_NUMBER" --marketing-version 1.0.1 --app "$private/Gridly.xcarchive/Products/Applications/App.app" --ipa "$ipa" --identity "$private/web-identity.json" > "$private/attestation.json"
          # Add only the independently checked control provenance to the
          # existing strict nonsecret application/signing attestation schema.
          python3 - "$private/attestation.json" <<'PY'
          import json, os, pathlib, re, subprocess, sys
          path = pathlib.Path(sys.argv[1])
          report = json.loads(path.read_text())
          control = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", control)
          assert report["source"] == os.environ["APPLICATION_SHA"]
          assert report["build"] == "16" and report["marketingVersion"] == "1.0.1"
          assert report["uploaded"] is False and report["nativeCodeParity"] is True
          report["controlCommit"] = control
          report["workflowSha256"] = __import__("hashlib").sha256(subprocess.check_output([
              "git", "-C", "../control", "show", control + ":.github/workflows/gridly-apple-build-9.yml"])).hexdigest()
          report["swiftLifecycleCasesPassed"] = 14
          path.write_text(json.dumps(report, sort_keys=True) + "\n")
          PY
          cat "$private/attestation.json" >&3
          cat "$private/attestation.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private signing material and all build outputs
        if: always()
        run: |
          set +x
          private="$RUNNER_TEMP/gridly-build-only-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_failed=0
          rm -f "$RUNNER_TEMP/gridly-swift-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt" || cleanup_failed=1
          if test -d "$private"; then
            if test -f "$private/previous-keychains.txt"; then
              python3 -c 'import pathlib, shlex, subprocess, sys; subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(pathlib.Path(sys.argv[1]).read_text())], check=True)' "$private/previous-keychains.txt" || cleanup_failed=1
            fi
            if test -f "$private/signing.keychain-db"; then security delete-keychain "$private/signing.keychain-db" 2>/dev/null || cleanup_failed=1; fi
            # Restore only the provisioning profile this job replaced.
            profile="$HOME/Library/MobileDevice/Provisioning Profiles/c0398bd6-9b5e-4935-82e7-40d117a4ccdc.mobileprovision"
            if test -f "$private/profile.mobileprovision" && test -f "$profile" && cmp -s "$profile" "$private/profile.mobileprovision"; then
              if test -f "$private/previous-profile.mobileprovision"; then cp "$private/previous-profile.mobileprovision" "$profile" || cleanup_failed=1; else rm -f "$profile" || cleanup_failed=1; fi
            fi
            rm -rf "$private" || cleanup_failed=1
          fi
          rm -rf "$GITHUB_WORKSPACE/candidate/www" "$GITHUB_WORKSPACE/candidate/ios/App/App/public" || cleanup_failed=1
          test ! -e "$private" || cleanup_failed=1
          if test "$cleanup_failed" = 0; then
            printf '%s\n' '{"cleanup":"PASS"}' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '{"cleanup":"FAIL"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$cleanup_failed"
