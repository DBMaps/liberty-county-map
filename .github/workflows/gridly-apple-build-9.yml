name: Gridly Apple Build 11

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact certified launch commit to package
        required: true
        type: string
      upload_to_app_store_connect:
        description: Validate and upload the signed Build 11 IPA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apple-build-11:
    if: ${{ inputs.upload_to_app_store_connect == true && github.ref == 'refs/heads/codex/final-store-builds-correct-lineage' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact certified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify source and Xcode
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_COMMIT_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          xcodebuild -version | grep -E '^Xcode 26([. ]|$)'
          grep -q 'GRIDLY_ANDROID_LICENSE_TEST_CANDIDATE = false' js/gridly-paid-ui.mjs
          grep -q 'gridly-paid-report' js/app.js
          grep -q 'versionCode 9' android/app/build.gradle
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and test paid reporting
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tests/paid-report-authorization.test.mjs tests/lp24465-paid-access.test.mjs
      - name: Stage production web runtime and sync iOS
        shell: bash
        env:
          GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64: ${{ secrets.GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64"
          printf '%s' "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64" | base64 -D > "$RUNNER_TEMP/native-provider-config.json"
          npm run build:native-assets
          node tools/native-web.mjs --runtime-config-file "$RUNNER_TEMP/native-provider-config.json" --report-file .artifacts/native-web-identity.json
          node tools/native-web.mjs --verify --report-file .artifacts/native-web-identity.json
          rm -f "$RUNNER_TEMP/native-provider-config.json"
          npx cap sync ios
          if test -f ios/App/Podfile; then (cd ios/App && pod install); fi
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Install distribution signing
        shell: bash
        env:
          APPLE_DIST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.APPLE_DIST_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_DIST_CERT_PEM_BASE64: ${{ secrets.APPLE_DIST_CERT_PEM_BASE64 }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          cleanup_signing_material() {
            rm -f "$RUNNER_TEMP/distribution-private.key" "$RUNNER_TEMP/distribution-cert.pem" "$RUNNER_TEMP/distribution.p12"
            unset TEMP_P12_PASSWORD KEYCHAIN_PASSWORD
          }
          trap cleanup_signing_material EXIT
          test -n "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64" && test -n "$APPLE_DIST_CERT_PEM_BASE64" && test -n "$APPLE_PROVISION_PROFILE_BASE64"
          printf '%s' "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64" | base64 -D > "$RUNNER_TEMP/distribution-private.key"
          printf '%s' "$APPLE_DIST_CERT_PEM_BASE64" | base64 -D > "$RUNNER_TEMP/distribution-cert.pem"
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.mobileprovision"
          KEY_PUBLIC_SHA=$(openssl pkey -in "$RUNNER_TEMP/distribution-private.key" -pubout -outform DER | shasum -a 256 | awk '{print $1}')
          CERT_PUBLIC_SHA=$(openssl x509 -in "$RUNNER_TEMP/distribution-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')
          test -n "$KEY_PUBLIC_SHA" && test "$KEY_PUBLIC_SHA" = "$CERT_PUBLIC_SHA"
          openssl version
          TEMP_P12_PASSWORD="$(openssl rand -hex 32)"
          export TEMP_P12_PASSWORD
          openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/distribution-private.key" -in "$RUNNER_TEMP/distribution-cert.pem" \
            -out "$RUNNER_TEMP/distribution.p12" -passout env:TEMP_P12_PASSWORD
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/distribution.p12" -passin env:TEMP_P12_PASSWORD -info -noout >/dev/null 2>&1
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" gridly-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" gridly-build.keychain
          security import "$RUNNER_TEMP/distribution.p12" -k gridly-build.keychain -P "$TEMP_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" gridly-build.keychain >/dev/null
          security list-keychains -d user -s gridly-build.keychain
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$APP_ID" = "$TEAM_ID.com.gridlygo.gridly"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          { printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME"; printf 'TEAM_ID=%s\n' "$TEAM_ID"; } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
      - name: Archive and export Build 11
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning gridly-build.keychain)"
          printf '%s\n' "$SIGNING_IDENTITIES"
          printf '%s\n' "$SIGNING_IDENTITIES" | grep -Eq '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} "Apple Distribution: [^"]+"'
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -showBuildSettings CURRENT_PROJECT_VERSION=11 DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" 2>&1 | \
            awk -F ' = ' '/^Build settings for action .* and target App:$/ { in_app=1; next } /^Build settings for action .* and target / { in_app=0 } in_app && NF >= 2 { key=$1; sub(/^[[:space:]]+/, "", key); if (key ~ /^(CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER)$/) print key " = " $2 }' | \
            tee "$RUNNER_TEMP/effective-signing-settings.txt"
          grep -Fxq 'CODE_SIGN_IDENTITY = Apple Distribution' "$RUNNER_TEMP/effective-signing-settings.txt"
          grep -Fxq 'CODE_SIGN_STYLE = Manual' "$RUNNER_TEMP/effective-signing-settings.txt"
          grep -Fxq 'DEVELOPMENT_TEAM = 2XSH6R7K37' "$RUNNER_TEMP/effective-signing-settings.txt"
          grep -Fxq 'PROVISIONING_PROFILE_SPECIFIER = Gridly App Store Build 9' "$RUNNER_TEMP/effective-signing-settings.txt"
          grep -Fxq 'PRODUCT_BUNDLE_IDENTIFIER = com.gridlygo.gridly' "$RUNNER_TEMP/effective-signing-settings.txt"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>com.gridlygo.gridly</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gridly-Build-11.xcarchive" CURRENT_PROJECT_VERSION=11 \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Gridly-Build-11.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/gridly-export"
          IPA=$(find "$RUNNER_TEMP/gridly-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" && test -f "$IPA"
          printf 'IPA_PATH=%s\n' "$IPA" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Gridly-Build-11.xcarchive/Products/Applications/App.app/Info.plist" | grep -x 11
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Gridly-Build-11.xcarchive/Products/Applications/App.app/Info.plist" | grep -x 1.0.0
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Gridly-Build-11.xcarchive/Products/Applications/App.app/Info.plist" | grep -x com.gridlygo.gridly
      - name: Certify archived and exported iPhone app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Gridly-Build-11.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 - "$APP" "$IPA_PATH" <<'PY'
          import json
          import plistlib
          import sys
          import zipfile
          from pathlib import Path

          app = Path(sys.argv[1])
          ipa = Path(sys.argv[2])
          expected = {
              "CFBundleShortVersionString": "1.0.0",
              "CFBundleVersion": "11",
              "CFBundleIdentifier": "com.gridlygo.gridly",
              "UIDeviceFamily": [1],
          }
          with (app / "Info.plist").open("rb") as file:
              archived = plistlib.load(file)
          with zipfile.ZipFile(ipa) as package:
              names = package.namelist()
              info_paths = [name for name in names if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
              assert len(info_paths) == 1, info_paths
              exported = plistlib.loads(package.read(info_paths[0]))
              for label, info in (("archive", archived), ("IPA", exported)):
                  actual = {key: info.get(key) for key in expected}
                  assert actual == expected, (label, actual)
                  assert 2 not in info["UIDeviceFamily"], (label, info["UIDeviceFamily"])
                  print(f"{label} identity: {json.dumps(actual, sort_keys=True)}")

              def packaged(path):
                  matches = [name for name in names if name.endswith("/public/" + path)]
                  assert len(matches) == 1, (path, matches)
                  return package.read(matches[0]).decode("utf-8")

              app_js = packaged("js/app.js")
              paid_files = {
                  path: packaged(path)
                  for path in (
                      "js/gridly-paid-bootstrap.js",
                      "js/gridly-paid-access.mjs",
                      "js/gridly-paid-startup.mjs",
                      "js/gridly-paid-config.mjs",
                      "js/gridly-paid-ui.mjs",
                  )
              }
              start = app_js.index("function gridlyAuthorizedReportTransport(")
              end = app_js.index("/* LP244.29A REPORTING AVAILABILITY RUNTIME START */", start)
              transport = app_js[start:end]
              assert 'client.functions.invoke("gridly-paid-report"' in transport
              assert "window.gridlyPaidReporting?.getProof()" in transport
              assert transport.count("client.rpc(") == 1
              assert 'if (name === "get_community_reporting_status") return client.rpc(name, args);' in transport
              assert "GRIDLY_ANDROID_LICENSE_TEST_CANDIDATE = false;" in paid_files["js/gridly-paid-ui.mjs"]
              assert "GRIDLY_ANDROID_LICENSE_TEST_CANDIDATE = true;" not in "\n".join(paid_files.values())
              assert "QA_BYPASS" not in "\n".join(paid_files.values())
              print("paid-report bridge and gridly-paid-report transport packaged")
              print("raw writer absent from packaged client transport; debug QA bypass absent")
          PY
      - name: Validate and upload IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY_P8_BASE64"; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s' "$ASC_PRIVATE_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
            chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            test -n "$APPLE_ID_USERNAME" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --username "$APPLE_ID_USERNAME" --password "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --username "$APPLE_ID_USERNAME" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi
      - name: Preserve signed artifact for owner review
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: gridly-apple-build-11
          path: |
            ${{ runner.temp }}/gridly-export/*.ipa
            ${{ runner.temp }}/Gridly-Build-11.xcarchive
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/native-provider-config.json" "$RUNNER_TEMP/distribution-private.key" "$RUNNER_TEMP/distribution-cert.pem" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          security delete-keychain gridly-build.keychain 2>/dev/null || true
