name: Gridly Apple Build 18 native integration (compile and archive only)

on:
  push:
    branches:
      - codex/arcgis-ios-build18-xctest-diagnostics

permissions:
  contents: read

concurrency:
  group: gridly-apple-build18-xctest-diagnostics
  cancel-in-progress: false

jobs:
  native-integration:
    if: >-
      github.repository == 'DBMaps/liberty-county-map' && github.actor == 'DBMaps' &&
      github.event_name == 'push' && github.ref == 'refs/heads/codex/arcgis-ios-build18-xctest-diagnostics' &&
      github.event.created == true && github.event.deleted == false && github.event.forced == false &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLICATION_SHA: b9cbff579b1cbf05842030fc01cd7ed60267dd1d
      INTEGRATION_BASE_SHA: 1055168666f094d2fd551d002b31556c81a8280b
      CERTIFIED_SOURCE_SHA: 88d410ea4b55f69dd7d6a3533b507211d47f8d56
      RELEASED_SHA: 71168111a133fa1c187620b9604b08e79fbf4687
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # Build 17 checkout revision
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 88d410ea4b55f69dd7d6a3533b507211d47f8d56
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent control and pinned application provenance
        run: |
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C control show -s --format=%P HEAD)" = "$CERTIFIED_SOURCE_SHA"
          test "$(git -C control diff --name-only --no-renames "$CERTIFIED_SOURCE_SHA" HEAD)" = "$(printf '%s\n' \
            .github/workflows/gridly-apple-build18-archive-only.yml \
            tests/arcgis-maintenance/ios-build18/test_swift_compile_only.py \
            tools/arcgis-maintenance/xctest-build-diagnostics.py)"
          test -z "$(git -C control status --porcelain)"
          test "$(git -C candidate rev-parse HEAD)" = "$CERTIFIED_SOURCE_SHA"
          test "$(git -C candidate show -s --format=%P HEAD)" = "$INTEGRATION_BASE_SHA"
          test "$(git -C candidate show -s --format=%P "$INTEGRATION_BASE_SHA")" = "$APPLICATION_SHA"
          test -z "$(git -C candidate status --porcelain)"
          git -C candidate diff --quiet "$APPLICATION_SHA" HEAD -- ios/App tools/arcgis-maintenance/native/ios \
            tests/arcgis-maintenance/ios-build18/Build18DiagnosticTests.swift
          git -C candidate merge-base --is-ancestor "$RELEASED_SHA" HEAD
          git -C candidate diff --quiet "$RELEASED_SHA" HEAD -- android css js capacitor.config.json package-lock.json \
            ios/App/CapApp-SPM ios/App/App/AppDelegate.swift \
            ios/App/App/capacitor.config.json ios/App/App/App.entitlements ios/App/App/App-Production.entitlements
          python3 -I -B - "$RELEASED_SHA" <<'PY'
          import plistlib, subprocess, sys
          from pathlib import Path

          path = "ios/App/App/Info.plist"
          original = plistlib.loads(subprocess.check_output(["git", "-C", "candidate", "show", f"{sys.argv[1]}:{path}"]))
          candidate = plistlib.loads(Path("candidate", path).read_bytes())
          assert candidate.pop("GridlyBuild18OwnerPublicKey") == "$(GRIDLY_BUILD18_OWNER_PUBLIC_KEY)"
          assert candidate == original
          PY
          test "$(uname -s):$(uname -m)" = Darwin:arm64
          test "$(xcodebuild -version)" = "$(printf '%s\n' 'Xcode 26.5' 'Build version 17F42')"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.5
          printf '%s\n' 'BUILD18_ARCHIVE_SOURCE_AND_TOOLCHAIN_PASS'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # Build 17 setup-node revision
        with:
          node-version: '22'
      - name: Run existing offline packaging, admission and recovery regressions
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          node --test tests/p0-apple-proof-clock.test.mjs tests/native-packaging.test.mjs \
            tests/build13-native-pending-recovery.test.cjs tests/paid-report-authorization.test.mjs \
            tests/lp24463-apple-storekit.test.mjs tests/lp24465-paid-access.test.mjs \
            tests/native-version-compatibility.test.mjs tests/arcgis-maintenance/build18.test.mjs
          # The existing 14 Swift lifecycle cases require execution and stay
          # with the separately authorized, isolated native test session.
          printf '%s\n' 'BUILD18_NATIVE_LIFECYCLE_14_DEFERRED'
      - name: Stage canonical web assets, sync, archive the App and build App-hosted XCTest
        working-directory: candidate
        run: |
          umask 077
          test ! -e www && test ! -L www
          test ! -e ios/App/App/public && test ! -L ios/App/App/public
          private="$(mktemp -d "$RUNNER_TEMP/gridly-build18-archive.XXXXXXXX")"
          stage=STAGING
          exec 3>&1
          cleanup() {
            status=$?
            trap - EXIT
            if test "$stage" = XCTEST_PRODUCT_IDENTITY && test "$status" -ne 0; then
              printf '%s\n' 'XCTEST_BUILD_CERTIFICATION=PRODUCT_VERIFICATION_FAILED' >&3
            fi
            if test "$status" -ne 0; then printf 'BUILD18_ARCHIVE_FAILED stage=%s exit_code=%d\n' "$stage" "$status" >&3; fi
            if ! rm -rf -- "$private" www ios/App/App/public; then
              printf '%s\n' 'BUILD18_ARCHIVE_CLEANUP_FAILED' >&3
              exit 1
            fi
            printf '%s\n' 'BUILD18_ARCHIVE_CLEANUP_PASS' >&3
            exit "$status"
          }
          trap cleanup EXIT
          exec > "$private/archive.log" 2>&1
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {runInNewContext} from 'node:vm';
          const scope = {window: {}};
          runInNewContext(readFileSync('js/gridlyRuntimeEnvironmentConfig.js', 'utf8'), scope, {timeout: 500});
          const config = scope.window;
          assert.ok(config.GRIDLY_RUNTIME_CONFIG);
          assert.ok(!config.GRIDLY_RUNTIME_CONFIG.arcgisStaticBasemapApiKey);
          assert.ok(!config.GRIDLY_CONFIG?.driveTexas?.apiKey && !config.GRIDLY_CONFIG?.txdot?.apiKey);
          assert.ok(!config.GRIDLY_TXDOT_API_KEY);
          JS
          node tools/native-assets.mjs
          node tools/native-web.mjs
          node tools/native-web.mjs --verify
          stage=CAP_SPM_MANIFEST_MISMATCH
          spm=ios/App/CapApp-SPM/Package.swift
          git show "HEAD:$spm" > "$private/Package.swift"
          stage=CAP_SYNC_COMMAND_FAILED
          npx --no-install cap sync ios
          # Capacitor 8.3.4 regenerates the SPM platform using only the major version.
          # Accept only that known rewrite, then archive with the reviewed 16.4 manifest.
          stage=CAP_SPM_MANIFEST_MISMATCH
          sed 's/\.iOS("16\.4")/\.iOS(.v16)/' "$private/Package.swift" > "$private/Package.generated.swift"
          cmp -s "$spm" "$private/Package.generated.swift" || cmp -s "$spm" "$private/Package.swift"
          stage=CAP_SPM_RESTORE_FAILED
          cp "$private/Package.swift" "$spm"
          cmp -s "$spm" "$private/Package.swift"
          stage=CAP_TRACKED_FILE_DRIFT
          tracked_changes="$(git status --porcelain --untracked-files=no)"
          test -z "$tracked_changes"
          stage=PACKAGE_RESOLUTION
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -derivedDataPath "$private/derived-data" -clonedSourcePackagesDirPath "$private/source-packages"
          stage=XCODE_ARCHIVE
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$private/derived-data" \
            -clonedSourcePackagesDirPath "$private/source-packages" -disableAutomaticPackageResolution \
            -archivePath "$private/Gridly.xcarchive" CURRENT_PROJECT_VERSION=18 MARKETING_VERSION=1.0.2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= GRIDLY_BUILD18_OWNER_PUBLIC_KEY= \
            STRIP_INSTALLED_PRODUCT=NO COPY_PHASE_STRIP=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='GRIDLY_ARCGIS_DIAGNOSTIC GRIDLY_BUILD18_DIAGNOSTIC' archive
          stage=ARCHIVE_IDENTITY
          test -z "$(git status --porcelain --untracked-files=no)"
          app="$private/Gridly.xcarchive/Products/Applications/App.app"
          python3 -I -B - "$app" >&3 <<'PY'
          import hashlib, plistlib, sys
          from pathlib import Path

          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Info.plist").read_bytes())
          expected = {"CFBundleIdentifier": "com.gridlygo.gridly", "CFBundleShortVersionString": "1.0.2",
                      "CFBundleVersion": "18", "MinimumOSVersion": "16.4", "UIDeviceFamily": [1],
                      "CFBundleExecutable": "App"}
          assert all(info.get(key) == value for key, value in expected.items())
          assert not info.get("GridlyBuild18OwnerPublicKey")
          assert not (app / "embedded.mobileprovision").exists()
          assert not (app / "_CodeSignature").exists()
          assert not any(app.rglob("*.xctest"))
          runtime = Path("js/gridlyRuntimeEnvironmentConfig.js")
          assert runtime.read_bytes() == (app / "public" / runtime).read_bytes()
          staged = Path("www")
          packed = app / "public"
          staged_files = {path.relative_to(staged) for path in staged.rglob("*") if path.is_file()}
          packed_files = {path.relative_to(packed) for path in packed.rglob("*") if path.is_file()}
          assert staged_files <= packed_files
          assert packed_files - staged_files <= {Path("cordova.js"), Path("cordova_plugins.js")}
          for path in staged_files:
              assert (staged / path).read_bytes() == (packed / path).read_bytes()
          digest = hashlib.sha256((app / "App").read_bytes()).hexdigest()
          print(f"BUILD18_UNSIGNED_ARCHIVE_IDENTITY_PASS executable_sha256={digest} web_files={len(staged_files)}")
          PY
          stage=DIAGNOSTIC_SYMBOLS
          xcrun nm -arch arm64 -U -j "$app/App" > "$private/symbols"
          for symbol in GridlyBuild18Candidate GridlyLabelDiagnostic GridlyBuild18DiagnosticViewController GridlyBridgeViewController; do
            grep -Fq "$symbol" "$private/symbols"
          done
          printf '%s\n' 'BUILD18_ACTUAL_APP_ARCHIVE_PASS DIAGNOSTIC_SYMBOLS_PRESENT' >&3
          printf '%s\n' 'APP_ARCHIVE_CERTIFIED' >&3

          stage=XCTEST_BUILD_FOR_TESTING
          xctest_exit=0
          xcodebuild -project ios/App/App.xcodeproj -scheme GridlyBuild18Diagnostics -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$private/derived-data" \
            -clonedSourcePackagesDirPath "$private/source-packages" -disableAutomaticPackageResolution \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= GRIDLY_BUILD18_OWNER_PUBLIC_KEY= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG GRIDLY_ARCGIS_DIAGNOSTIC GRIDLY_BUILD18_DIAGNOSTIC' build-for-testing \
            > "$private/xctest-build.log" 2>&1 || xctest_exit=$?
          if test "$xctest_exit" -ne 0; then
            printf '%s\n' 'XCTEST_BUILD_CERTIFICATION=FAILED' >&3
            python3 -I -B ../control/tools/arcgis-maintenance/xctest-build-diagnostics.py "$private/xctest-build.log" >&3 ||
              printf '%s\n' 'BUILD18_XCTEST_DIAGNOSTIC code=DIAGNOSTICS_UNAVAILABLE' >&3
            exit "$xctest_exit"
          fi
          stage=XCTEST_PRODUCT_IDENTITY
          test -z "$(git status --porcelain --untracked-files=no)"
          test_binary="$(python3 -I -B - "$private/derived-data/Build/Products" <<'PY'
          import plistlib, sys
          from pathlib import Path

          products = Path(sys.argv[1]).resolve()
          manifests = list(products.glob("*.xctestrun"))
          assert len(manifests) == 1
          manifest = plistlib.loads(manifests[0].read_bytes())
          if "TestConfigurations" in manifest:
              targets = [target for config in manifest["TestConfigurations"] for target in config["TestTargets"]]
          else:
              targets = [target for target in manifest.values() if "TestBundlePath" in target]
          assert len(targets) == 1
          target = targets[0]
          host = Path(target["TestHostPath"].replace("__TESTROOT__", str(products))).resolve()
          assert host == products / "Debug-iphonesimulator" / "App.app"
          bundle = Path(target["TestBundlePath"].replace("__TESTROOT__", str(products))
                        .replace("__TESTHOST__", str(host))).resolve()
          assert bundle in {host / "PlugIns" / "GridlyBuild18Tests.xctest",
                            host.parent / "GridlyBuild18Tests.xctest"}
          host_info = plistlib.loads((host / "Info.plist").read_bytes())
          assert host_info["CFBundleIdentifier"] == "com.gridlygo.gridly"
          assert host_info["CFBundleVersion"] == "18" and host_info["CFBundleShortVersionString"] == "1.0.2"
          assert not host_info.get("GridlyBuild18OwnerPublicKey")
          info = plistlib.loads((bundle / "Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "com.gridlygo.gridly.Build18Tests"
          assert info["CFBundleExecutable"] == "GridlyBuild18Tests"
          binary = bundle / "GridlyBuild18Tests"
          assert binary.is_file() and (host / "App").is_file()
          print(binary)
          PY
          )"
          xcrun nm -arch arm64 -U -j "$test_binary" > "$private/test-symbols"
          grep -Fq 'Build18DiagnosticTests' "$private/test-symbols"
          printf '%s\n' 'XCTEST_BUILD_CERTIFICATION=PASSED' \
            'BUILD18_APP_HOSTED_XCTEST_BUILD_PASS' 'BUILD18_NATIVE_EXECUTION_NOT_RUN' >&3
