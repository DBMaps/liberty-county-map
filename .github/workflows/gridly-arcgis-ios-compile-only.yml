name: Gridly ArcGIS iOS Swift Compile Only

on:
  push:
    branches:
      - codex/arcgis-maintenance-ios-compile-only

permissions:
  contents: read

jobs:
  swift-object-check:
    if: >-
      github.repository == 'DBMaps/liberty-county-map' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/arcgis-maintenance-ios-compile-only' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - name: Compile the Swift adapter to a disposable object
        run: python3 -I -B tests/arcgis-maintenance/ios-offline/swift_compile_only.py
