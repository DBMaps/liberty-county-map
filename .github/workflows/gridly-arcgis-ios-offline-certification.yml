name: Gridly ArcGIS iOS Offline Certification

on:
  push:
    branches:
      - codex/arcgis-maintenance-ios-offline-certification

permissions:
  contents: read

jobs:
  synthetic-certification:
    if: >-
      github.repository == 'DBMaps/liberty-county-map' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/arcgis-maintenance-ios-offline-certification' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Check out the reviewed push
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - name: Run disposable synthetic certification
        run: python3 -I -B tests/arcgis-maintenance/ios-offline/run.py
      - name: Retain the allowlisted result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcgis-ios-synthetic-certification
          path: ${{ runner.temp }}/gridly-arcgis-synthetic-result.json
          if-no-files-found: error
          retention-days: 7
