name: Gridly Build 15 Signing and Cleanup Diagnostic

# LOCAL PREPARATION ONLY. A future reviewed commit and separate explicit owner
# authorization are required before creating or pushing this annotated tag.
# Tag: gridly-storekit-signing-diagnostic-15-<exact-reviewed-commit>
# Exact annotation, with no extra fields or account/credential information:
# {"signing_diagnostic_commit":"<exact-reviewed-40-hex>",
#  "delivery_source_commit":"4c95caed0d261fca1dbaf86fc926660661d0643b",
#  "failed_delivery_run_id":39196269782,
#  "historical_certification_run_id":39181592021,
#  "signing_only_authorized":true,"signing_credentials_access_authorized":true,
#  "private_home_reproduction_authorized":true,
#  "no_application_build_or_upload_confirmed":true}
# Only ONE direct child of the pinned delivery source, adding these three
# diagnostic files with mode 100644, is accepted. Existing source stays frozen.
on:
  push:
    tags:
      - 'gridly-storekit-signing-diagnostic-15-*'

permissions:
  contents: read

jobs:
  diagnose-storekit-signing:
    if: ${{ github.repository == 'DBMaps/liberty-county-map' && github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 && startsWith(github.ref, 'refs/tags/gridly-storekit-signing-diagnostic-15-') }}
    runs-on: macos-26
    timeout-minutes: 15
    concurrency:
      group: gridly-build-15-signing-only
      cancel-in-progress: false
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout exact reviewed signing-only source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner permission and prepare private signing-only workspace
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 -B tools/apple_storekit_signing_diagnostic.py prepare 2>/dev/null
      - name: Diagnose the original fourteen signing stages once
        id: signing_once
        env:
          APPLE_DIST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.APPLE_DIST_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_DIST_CERT_PEM_BASE64: ${{ secrets.APPLE_DIST_CERT_PEM_BASE64 }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 -B tools/apple_storekit_signing_diagnostic.py sign 2>/dev/null
      - name: Independently remove private signing resources and verify absence
        if: always()
        env:
          SIGNING_STEP_OUTCOME: ${{ steps.signing_once.outcome }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 -B tools/apple_storekit_signing_diagnostic.py cleanup 2>/dev/null
