name: Gridly StoreKit Build 15 Internal TestFlight Delivery

# LOCAL PREPARATION ONLY: do not push a tag until the resulting delivery commit is
# reviewed and a NEW upload authorization is explicitly granted by the owner.
# Separate annotated tag: gridly-storekit-testflight-deliver-15-<delivery-commit>
# Pinned source chain: f9fc8183 -> bd5b1fea -> 45bfe026 -> 13e73183
# -> 4c95caed (four-file refinement) -> db4df394 (signing diagnostic)
# -> cbe3c297 (CMS diagnostic) -> ONE direct-child repair of four reviewed support files.
# Preflight workflow/helper, historical tags and certified diagnostic runtime stay frozen.
# Strict disabled-automatic-distribution JSON (unchanged; no omitted/default/extra fields):
# {"delivery_commit":"<reviewed-40-hex>","certified_source_commit":"f9fc818321970b8b7e29df17358daf87a7d20308",
#  "certification_run_id":39181592021,"diagnostic_build_number":"15",
#  "testflight_upload_authorized":true,"unused_build_number_confirmed":true,
#  "baseline_exception_acknowledged":true,"testflight_group_settings_reviewed":true,
#  "testflight_auto_distribution_disabled":true,"app_store_connect_users_access_reviewed":true,
#  "no_unapproved_internal_access_confirmed":true,"owner_checks_at":"<UTC YYYY-MM-DDTHH:MM:SSZ>"}
# Alternative OWNER-ONLY automatic distribution: use all the fields above, set
# "testflight_auto_distribution_disabled":false, and add exactly this object:
# "owner_only_automatic_distribution":{
#   "authorized":true,"group_name":"Gridly Internal","authorized_owner_account_count":2,
#   "both_accounts_owned_by_owner":true,
#   "automatic_availability_to_both_accounts_acknowledged":true,
#   "no_other_eligible_internal_users_confirmed":true}
# This acknowledges that Build 15 may become available automatically to BOTH
# authorized owner accounts. Do not record account names, email addresses or identifiers.
# A true disabled flag plus this object is contradictory and is rejected.
# owner_checks_at must freshly cover both accounts, every internal group and ALL
# eligible App Store Connect users, including the built-in App Store Connect Users group.
# Existing group membership alone is insufficient. No tester/group change is performed.
# Owner checks expire after 30 minutes, including the rebuild and Apple validation.
# The existing certification tag cannot activate this workflow. No dispatch or branch trigger.
# Only writers authorized by the owner may push the new annotated delivery tag.
# No retry: if Apple acceptance is uncertain, investigate before any new authorization.
# No artifacts/caches, group assignments, invitations, external testing or store release.
# Tool home, generated runtime, raw logs, reports, signed output and keys are runner-private.
on:
  push:
    tags:
      - 'gridly-storekit-testflight-deliver-15-*'

permissions:
  contents: read
  actions: read

jobs:
  deliver-internal-testflight:
    if: ${{ github.repository == 'DBMaps/liberty-county-map' && github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 && startsWith(github.ref, 'refs/tags/gridly-storekit-testflight-deliver-15-') }}
    concurrency:
      group: gridly-storekit-internal-testflight-build-15
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact reviewed diagnostic candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare private runner-local workspace
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 -B tools/apple_storekit_testflight_delivery.py private-init --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Validate explicit owner authorization before build or secret access
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-1.log" 2>&1
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          python3 -B tools/apple_storekit_testflight_delivery.py authorize --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_PATH" --attempt "$GITHUB_RUN_ATTEMPT" --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" --output "$DIAGNOSTIC_PRIVATE_ROOT/reports/delivery-authorization.json"
      - name: Verify source, build identity input and Xcode
        env:
          GRIDLY_HISTORY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          # FD 3 carries only validated fixed stage records; raw output stays private.
          exec 3>&1
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-2.log" 2>&1
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          python3 -B tools/apple_storekit_testflight_delivery.py preflight --commit "$EXPECTED_COMMIT_SHA" --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" --output "$DIAGNOSTIC_PRIVATE_ROOT/reports/delivery-preflight.json"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute regressions and record any exact acknowledged baseline exception
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-3.log" 2>&1
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          npm ci
          npx playwright install msedge
          set +e
          node --test --test-reporter=tap tests/storekit-diagnostics.test.mjs tests/build13-native-pending-recovery.test.cjs tests/paid-report-authorization.test.mjs tests/lp24465-paid-access.test.mjs tests/build11-pending-report-recovery.test.cjs tests/lp24463-apple-storekit.test.mjs tests/native-packaging.test.mjs tests/lp24466s-settings-restore.test.mjs tests/lp24466s-admitted-runtime.test.mjs > "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-regressions.tap" 2>&1
          regression_exit=$?
          set -e
          python3 -B tools/apple_storekit_diagnostic_certification.py regressions --tap "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-regressions.tap" --exit-code "$regression_exit" --baseline-acknowledged --output "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-regressions.json"
      - name: Native lifecycle, diagnostic helper and parity tests
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-4.log" 2>&1
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          python3 -B tests/storekit-testflight-delivery.test.py
          python3 -B tests/build14-native-lifecycle.test.py
          python3 -B tests/storekit-diagnostics-native.test.py
          python3 -B tests/apple_native_parity_test.py
          python3 -B tools/apple_storekit_diagnostic_certification.py activation --build-number "$DIAGNOSTIC_BUILD_NUMBER" --output "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-activation.json"
      - name: Stage governed runtime and synchronize iOS
        shell: bash
        env:
          GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64: ${{ secrets.GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-5.log" 2>&1
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          test -n "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64"
          trap 'rm -f "$DIAGNOSTIC_PRIVATE_ROOT/diagnostic-native-provider-config.json"' EXIT
          printf '%s' "$GRIDLY_NATIVE_PROVIDER_CONFIG_BASE64" | base64 -D > "$DIAGNOSTIC_PRIVATE_ROOT/diagnostic-native-provider-config.json"
          npm run build:native-assets
          node tools/native-web.mjs --runtime-config-file "$DIAGNOSTIC_PRIVATE_ROOT/diagnostic-native-provider-config.json" --report-file "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-native-web.json"
          node tools/native-web.mjs --verify --report-file "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-native-web.json"
          npx cap sync ios
          if test -f ios/App/Podfile; then (cd ios/App && pod install); fi
          ( . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"; xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath "$DIAGNOSTIC_PRIVATE_ROOT/gridly-storekit-diagnostic-derived-data" -clonedSourcePackagesDirPath "$DIAGNOSTIC_PRIVATE_ROOT/source-packages" )
      - name: Install distribution signing
        shell: bash
        env:
          APPLE_DIST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.APPLE_DIST_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_DIST_CERT_PEM_BASE64: ${{ secrets.APPLE_DIST_CERT_PEM_BASE64 }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-6.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          umask 077
          python3 -B tools/apple_storekit_testflight_delivery.py signing-context --runner-temp "$RUNNER_TEMP" --commit "$EXPECTED_COMMIT_SHA"
          cleanup_signing_material() {
            rm -f "$DIAGNOSTIC_PRIVATE_ROOT/distribution-private.key" "$DIAGNOSTIC_PRIVATE_ROOT/distribution-cert.pem" "$DIAGNOSTIC_PRIVATE_ROOT/distribution.p12"
            unset TEMP_P12_PASSWORD KEYCHAIN_PASSWORD
          }
          trap cleanup_signing_material EXIT
          test -n "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64" && test -n "$APPLE_DIST_CERT_PEM_BASE64" && test -n "$APPLE_PROVISION_PROFILE_BASE64"
          printf '%s' "$APPLE_DIST_PRIVATE_KEY_PEM_BASE64" | base64 -D > "$DIAGNOSTIC_PRIVATE_ROOT/distribution-private.key"
          printf '%s' "$APPLE_DIST_CERT_PEM_BASE64" | base64 -D > "$DIAGNOSTIC_PRIVATE_ROOT/distribution-cert.pem"
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 -D > "$DIAGNOSTIC_PRIVATE_ROOT/distribution.mobileprovision"
          KEY_PUBLIC_SHA=$(openssl pkey -in "$DIAGNOSTIC_PRIVATE_ROOT/distribution-private.key" -pubout -outform DER | shasum -a 256 | awk '{print $1}')
          CERT_PUBLIC_SHA=$(openssl x509 -in "$DIAGNOSTIC_PRIVATE_ROOT/distribution-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')
          test -n "$KEY_PUBLIC_SHA" && test "$KEY_PUBLIC_SHA" = "$CERT_PUBLIC_SHA"
          openssl version
          TEMP_P12_PASSWORD="$(openssl rand -hex 32)"
          export TEMP_P12_PASSWORD
          openssl pkcs12 -export -legacy -inkey "$DIAGNOSTIC_PRIVATE_ROOT/distribution-private.key" -in "$DIAGNOSTIC_PRIVATE_ROOT/distribution-cert.pem" \
            -out "$DIAGNOSTIC_PRIVATE_ROOT/distribution.p12" -passout env:TEMP_P12_PASSWORD
          openssl pkcs12 -legacy -in "$DIAGNOSTIC_PRIVATE_ROOT/distribution.p12" -passin env:TEMP_P12_PASSWORD -info -noout >/dev/null 2>&1
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db"
          security import "$DIAGNOSTIC_PRIVATE_ROOT/distribution.p12" -k "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db" -P "$TEMP_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db"
          security cms -D -k "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db" -i "$DIAGNOSTIC_PRIVATE_ROOT/distribution.mobileprovision" > "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist")
          test "$APP_ID" = "$TEAM_ID.com.gridlygo.gridly"
          test "$PROFILE_NAME" = 'Gridly App Store Build 9'
          test "$TEAM_ID" = '2XSH6R7K37'
          test "$PROFILE_UUID" = "$(python3 -B -c 'import sys; sys.path.insert(0,"tools"); import apple_native_parity as release; print(release.PROFILE_UUID)')"
          python3 -B tools/apple_storekit_testflight_delivery.py profile-install --runner-temp "$RUNNER_TEMP" --commit "$EXPECTED_COMMIT_SHA"
          { printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME"; printf 'TEAM_ID=%s\n' "$TEAM_ID"; } >> "$GITHUB_ENV"
          rm -f "$DIAGNOSTIC_PRIVATE_ROOT/distribution.mobileprovision" "$DIAGNOSTIC_PRIVATE_ROOT/profile.plist"
      - name: Signing identity precheck
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-7-1.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          security find-identity -v -p codesigning "$DIAGNOSTIC_PRIVATE_ROOT/signing.keychain-db" | grep -Fq '1264FCB7434D20490824D05F959D90D3825EA45C "Apple Distribution: DJ Burns Collective LLC (2XSH6R7K37)"'
      - name: Xcode build-settings query
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-7-2.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          xcode_status=0
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$DIAGNOSTIC_PRIVATE_ROOT/gridly-storekit-diagnostic-derived-data" -clonedSourcePackagesDirPath "$DIAGNOSTIC_PRIVATE_ROOT/source-packages" \
            -showBuildSettings CURRENT_PROJECT_VERSION="$DIAGNOSTIC_BUILD_NUMBER" MARKETING_VERSION=1.0.0 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRIDLY_STOREKIT_DIAGNOSTICS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" > "$DIAGNOSTIC_PRIVATE_ROOT/logs/build-settings-raw.log" 2>&1 || xcode_status=$?
          if [ "$xcode_status" -ne 0 ]; then exit "$xcode_status"; fi
          awk -F ' = ' '/^Build settings for action .* and target App:$/ { in_app=1; next } /^Build settings for action .* and target / { in_app=0 } in_app && NF >= 2 { key=$1; sub(/^[[:space:]]+/, "", key); if (key ~ /^(CURRENT_PROJECT_VERSION|MARKETING_VERSION|SWIFT_ACTIVE_COMPILATION_CONDITIONS|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER)$/) print key " = " $2 }' "$DIAGNOSTIC_PRIVATE_ROOT/logs/build-settings-raw.log" > "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-build-settings.txt"
      - name: Xcode archive
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          # FD 3 carries only the fixed archive classification; raw output stays private.
          exec 3>&1
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-7-3.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          archive="$DIAGNOSTIC_PRIVATE_ROOT/Gridly-StoreKit-Diagnostic-$DIAGNOSTIC_BUILD_NUMBER.xcarchive"
          archive_status=0
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$DIAGNOSTIC_PRIVATE_ROOT/gridly-storekit-diagnostic-derived-data" -clonedSourcePackagesDirPath "$DIAGNOSTIC_PRIVATE_ROOT/source-packages" -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$DIAGNOSTIC_BUILD_NUMBER" MARKETING_VERSION=1.0.0 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRIDLY_STOREKIT_DIAGNOSTICS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive > "$DIAGNOSTIC_PRIVATE_ROOT/logs/archive-raw.log" 2>&1 || archive_status=$?
          python3 -B tools/apple_storekit_testflight_delivery.py archive-public --runner-temp "$RUNNER_TEMP" --archive-exit "$archive_status" || true
          exit "$archive_status"
      - name: Internal-only IPA export
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-7-4.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          archive="$DIAGNOSTIC_PRIVATE_ROOT/Gridly-StoreKit-Diagnostic-$DIAGNOSTIC_BUILD_NUMBER.xcarchive"
          cat > "$DIAGNOSTIC_PRIVATE_ROOT/DiagnosticExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>com.gridlygo.gridly</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$DIAGNOSTIC_PRIVATE_ROOT/DiagnosticExportOptions.plist" -exportPath "$DIAGNOSTIC_PRIVATE_ROOT/gridly-diagnostic-export"
      - name: Signed IPA certification
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-7-5.log" 2>&1
          . "$DIAGNOSTIC_PRIVATE_ROOT/runner-context.sh"
          cd "$DELIVERY_SOURCE_DIR"
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          archive="$DIAGNOSTIC_PRIVATE_ROOT/Gridly-StoreKit-Diagnostic-$DIAGNOSTIC_BUILD_NUMBER.xcarchive"
          ipa=$(find "$DIAGNOSTIC_PRIVATE_ROOT/gridly-diagnostic-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa" && test -f "$ipa"
          python3 -B tools/apple_storekit_diagnostic_certification.py certify \
            --app "$archive/Products/Applications/App.app" --ipa "$ipa" \
            --build-number "$DIAGNOSTIC_BUILD_NUMBER" --commit "$EXPECTED_COMMIT_SHA" \
            --web-report "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-native-web.json" --settings "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-build-settings.txt" \
            --activation-report "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-activation.json" --output "$DIAGNOSTIC_PRIVATE_ROOT/reports/storekit-diagnostic-certification.json"
      - name: Validate availability and deliver only the fully certified internal IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          exec > "$DIAGNOSTIC_PRIVATE_ROOT/logs/step-8.log" 2>&1
          export TMPDIR="$DIAGNOSTIC_PRIVATE_ROOT/tmp/"
          cd "$DELIVERY_SOURCE_DIR"
          ipa=$(find "$DIAGNOSTIC_PRIVATE_ROOT/gridly-diagnostic-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa" && test -f "$ipa"
          python3 -B tools/apple_storekit_testflight_delivery.py transfer --runner-temp "$RUNNER_TEMP" --commit "$EXPECTED_COMMIT_SHA" --ipa "$ipa"
      - name: Remove all private outputs and report fixed delivery statuses
        if: always()
        shell: bash
        env:
          DELIVERY_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          set +x
          python3 -B tools/apple_storekit_testflight_delivery.py finish-public --runner-temp "$RUNNER_TEMP" --job-status "$DELIVERY_JOB_STATUS"
