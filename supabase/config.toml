# Supabase local/API configuration tracked for Gridly schema exposure governance.
# V425 exposes only the approved schemas required by the PostgREST API.

[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[functions.gridly-geocode]
verify_jwt = false

# Dedicated monitor bearer authentication is enforced by the handler.
[functions.gridly-cleanup-health]
verify_jwt = false

# Native admission uses App Attest/Play Integrity and a one-time challenge.
# The challenge function accepts only the Cloudflare gateway's shared token.
[functions.gridly-subscription-challenge]
verify_jwt = false

[functions.gridly-verify-apple-subscription]
verify_jwt = false

[functions.gridly-verify-google-subscription]
verify_jwt = false

# Isolated license-test authority; native Play Integrity and a consumed challenge
# are required by the handler even though the gateway JWT check is disabled.
[functions.gridly-verify-google-sandbox-subscription]
verify_jwt = false

# The handler verifies a short-lived production entitlement proof before its
# service-role call to the protocol-v2 atomic writer.
[functions.gridly-paid-report]
verify_jwt = false

# Separate constant-time operations token in the handler.
[functions.gridly-subscription-ops]
verify_jwt = false

# Google Pub/Sub OIDC bearer validation is enforced by the RTDN handler.
[functions.gridly-google-rtdn]
verify_jwt = false
