<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP076 Learning Foundation Certification</title>
<style>:root{font:100%/1.55 system-ui,sans-serif;color:#17201c;background:#eef3f0}body{margin:0}main{max-width:58rem;margin:auto;padding:2rem}header,section{background:white;border:1px solid #bdcac2;border-radius:.7rem;padding:1.25rem;margin-bottom:1rem}.pass{color:#176b3a}.fail{color:#a12622}li{margin:.6rem 0}@media(max-width:30rem){main{padding:.6rem}}@media(prefers-color-scheme:dark){:root{color:#edf4f0;background:#111815}header,section{background:#18221d;border-color:#526258}.pass{color:#77d69a}.fail{color:#ff918a}}</style></head>
<body><main><header><p>Know Before You Go · Isolated certification</p><h1>Historical Intelligence learning foundation</h1><p>This internal harness does not load or change the production application.</p></header><section><h2>Certification results</h2><ol id="results"></ol></section></main>
<script src="../js/historical-observation-learning.js"></script><script src="../js/historical-pattern-intelligence.js"></script><script>
(()=>{const learning=window.gridlyHistoricalObservationLearning;const pattern=window.gridlyHistoricalPatternIntelligence;const checks=[];const check=(name,passed,evidence)=>checks.push({name,passed:passed===true,evidence});const row=(id,date,extra={})=>({id,awareness_area:"Dayton",community:"Dayton",county:"Liberty County",road_name:"Waco Street",crossing_name:"Waco Street",hazard_type:"blocked_crossing",event_type:"rail_delay",observed_at:date,...extra});const opts={validAwarenessAreas:["Dayton"],validCounties:["Liberty County"]};
check("observation qualification",learning.qualifyObservation(row("a","2026-07-01T11:00:00Z"),opts).eligible,"A complete, supported, geographically grounded observation qualifies.");
const archived=learning.archiveObservation(row("a","2026-07-01T11:00:00Z"),opts);check("archive construction",archived.archived&&archived.record.archiveVersion===1&&Object.isFrozen(archived.record),"The durable record is versioned, normalized, and immutable.");
const learned=learning.ingestIncrementally([], [row("a","2026-07-01T11:00:00Z"),row("b","2026-07-09T11:05:00Z"),row("c","2026-07-17T10:55:00Z")],opts);const next=learning.ingestIncrementally(learned.archive,[row("d","2026-07-25T11:00:00Z")],opts);check("incremental learning",next.added.length===1&&next.archive.length===4&&!next.rebuildRequired,"One observation is appended without a complete rebuild.");
check("learning isolation",Object.values(learning.ACTIVATION).join(",")==="false,false,false,true","All activation guards remain closed and explicit opt-in remains required.");
check("observation aging",[10,60,240,500].map(days=>learning.agingStatus({observationTimestamp:new Date(Date.parse("2026-07-27")-days*86400000).toISOString()},"2026-07-27T00:00:00Z")).join(",")==="recent,established,aging,inactive","Aging is classified without deletion or retention behavior.");
const bad=learning.ingestIncrementally([], [row("x","invalid"),row("y","2026-07-01T11:00:00Z",{hazard_type:"unknown",event_type:"unknown"})],opts);check("learning quality",bad.archive.length===0&&bad.rejected.length===2,"Invalid and unsupported evidence cannot enter the archive.");
check("LP067 compatibility",pattern.discoverPatterns(learning.toLP067Observations(next.archive),{now:"2026-07-27T12:00:00Z"}).length===1,"LP067 consumes qualified archive records through its unchanged normalized-observation contract.");
check("production isolation",!document.querySelector('script[src*="app.js"]')&&learning.ACTIVATION.productionIntegration===false,"The harness loads only isolated learning and LP067 modules, never production app.js.");
const passed=checks.every(item=>item.passed===true);document.getElementById("results").innerHTML=checks.map(item=>`<li class="${item.passed?'pass':'fail'}"><strong>${item.passed?'PASS':'FAIL'} — ${item.name}</strong><br>${item.evidence}</li>`).join("");document.body.dataset.certification=passed?"pass":"fail";window.__LP076_CERTIFICATION__={passed,checks,learningFoundationComplete:passed,archiveModelComplete:checks[1].passed,qualificationModelComplete:checks[0].passed,productionIsolationPreserved:checks[7].passed,activation:learning.ACTIVATION,activationRemainsDisabled:learning.ACTIVATION.activationAuthorized===false};})();
</script></body></html>
