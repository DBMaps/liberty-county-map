<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LP091 Browser Certification</title></head>
<body>
<h1>LP091 Historical Pipeline Browser Certification</h1>
<p>Open the console and paste the complete certification block shown below.</p>
<pre id="command"></pre>
<script src="../js/historical-pipeline-certification.js"></script>
<script>
const block = `(() => {
  const required = ["passive", "productionIsolationPreserved", "pipelineCertificationAvailable", "crossLayerCompatibilityAvailable", "identityLineageAvailable", "fingerprintContinuityAvailable", "deterministicReplayCertificationAvailable", "completeCompatibilityCertificationAvailable", "protectedSystemsCertificationAvailable", "productionIsolationCertificationAvailable", "deterministicFailureCertificationAvailable", "explainabilityAvailable", "certificationReportAvailable", "policyVersionGovernanceAvailable", "deterministicPipelinePass", "activationStillDisabled", "protectedSystemsUnchanged", "safeToMerge"];
  const audit = window.gridlyLp091HistoricalPipelineCertificationAudit();
  const rows = required.map(check => ({ check, passed: audit[check] === true, value: audit[check] }));
  console.table(rows);
  const failed = rows.filter(row => !row.passed).map(row => row.check);
  if (failed.length) { console.error("LP091 BROWSER CERTIFICATION FAILED", failed); return false; }
  console.log("✅ LP091 BROWSER CERTIFICATION PASSED — SAFE TO MERGE");
  return true;
})();`;
document.getElementById("command").textContent = block;
</script>
</body></html>
